---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# =============================================================================
# Docker merge for the readiness image.
#
# On every merged change, builds ./Dockerfile as onap/oom/readiness through
# the docker-workflows merge reusable, gates it on hadolint, the image SBOM
# and a Grype scan, then stages it on the snapshot registry under the tag
# set derived from version.properties:
#
#   nexus3.onap.org:10003/onap/oom/readiness:X.Y.Z-SNAPSHOT-latest
#   nexus3.onap.org:10003/onap/oom/readiness:X.Y-STAGING-latest
#   nexus3.onap.org:10003/onap/oom/readiness:X.Y.Z-<timestamp>Z
#
# On master it then points nexus3.onap.org:10003/onap/oom/readiness:latest
# at the same image (see LATEST).
#
# A merged change that adds a releases/*-container.yaml file also promotes
# the images it names to nexus3.onap.org:10002, copying by digest.
#
# IMAGE NAME
#
# build_command builds the image and build_command_images names the
# reference the publish step stages. The reusable's 'images' input is not
# used: its image matrix rewrites every character outside [a-z0-9._-] to
# '-', '/' included, so oom/readiness would stage as onap/oom-readiness
# while release promotion reads onap/oom/readiness, the name the
# container release files give. Declaring the reference keeps staging
# and promotion on one path. 'images' can return once the matrix keeps
# '/' in image names.
#
# PUBLISHING
#
# The publish jobs log in to Nexus as the account 'oom-readiness' with the
# password held under the item of the same name in the organisation's
# 1Password vault; the reusable derives both names from the repository.
# Only the publish jobs and tag-latest load the credential.
#
# Promotion never overwrites a release tag: it skips one that already
# holds the staged digest, and fails before writing anything on one that
# holds a different image.
#
# LATEST
#
# The container release files promote 'latest' from the snapshot
# registry, a tag the Jenkins docker merge job wrote on every master
# build. The reusable stages only the version-derived tags above, so on
# master the tag-latest job copies the manifest of the snapshot this run
# staged to 'latest', giving both tags one digest. Remove the job once
# the reusable can write 'latest' itself. While the Jenkins job remains,
# both write 'latest' from the same branch, and the later write holds
# the tag.
#
# NO SCHEDULE
#
# The Jenkins docker merge job also rebuilt master weekly; that is not
# carried over. The build is pinned (Go toolchain image tag and go.sum),
# so a weekly rebuild changes only the distroless base layer, and every
# merge rebuilds 'latest', the tag a release ships. GitHub also disables
# a schedule after 60 days without repository activity. And the reusable
# checks the newest commit for a container release file on every run, so
# a timed run would re-attempt promotion whenever a release commit sits
# at the branch tip. A 'remerge' comment on the newest merged change
# rebuilds the branch on demand.
#
# REPORT-ONLY CHECKS AND EGRESS
#
# lint_permit_fail, grype_permit_fail and build_permit_egress_traffic are
# set for the reasons given in gerrit-docker-verify.yaml: hadolint reports
# DL3066 against the current Dockerfile, Grype advisories move
# independently of the merged change, and gcr.io (the distroless base) is
# not on the pinned egress allow-list. Findings are reported; staging is
# not withheld for them.
#
# grype_cache_db is restore-only because both lanes share one Grype
# database cache prefix and only one job should save it; the verify lane,
# which runs on every patchset, keeps it fresh.
#
# DEPLOYMENT NOTES:
#   * gerrit_to_platform discovers this caller by filename (contains both
#     'gerrit' and 'merge') and dispatches it on change-merged and on a
#     'remerge' comment.
#   * The file must exist on every branch that should publish.
#   * Merge lanes comment on the change; they never vote.
#   * GERRIT_DISABLED runs the lane manually from the GitHub UI against
#     the default branch, without touching Gerrit.
#   * Uses the organisation variables GERRIT_SERVER, GERRIT_SSH_USER,
#     GERRIT_KNOWN_HOSTS, GERRIT_URL and the secrets GERRIT_SSH_PRIVKEY,
#     OP_SERVICE_ACCOUNT_TOKEN and VAULT_MAPPING_JSON.
# =============================================================================
name: "Gerrit Docker Merge"

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
    inputs:
      GERRIT_BRANCH:
        description: "Branch that change is against"
        required: false
        type: string
        default: ""
      GERRIT_CHANGE_ID:
        description: "The ID for the change"
        required: false
        type: string
        default: ""
      GERRIT_CHANGE_NUMBER:
        description: "The Gerrit number"
        required: false
        type: string
        default: ""
      GERRIT_CHANGE_URL:
        description: "URL to the change"
        required: false
        type: string
        default: ""
      GERRIT_EVENT_TYPE:
        description: "Type of Gerrit event"
        required: false
        type: string
        default: ""
      GERRIT_PATCHSET_NUMBER:
        description: "The patch number for the change"
        required: false
        type: string
        default: ""
      GERRIT_PATCHSET_REVISION:
        description: "The revision sha"
        required: false
        type: string
        default: ""
      GERRIT_PROJECT:
        description: "Project in Gerrit"
        required: false
        type: string
        default: ""
      GERRIT_REFSPEC:
        description: "Gerrit refspec of change"
        required: false
        type: string
        default: ""
      GERRIT_DISABLED:
        description: "Run without Gerrit components"
        required: false
        default: false
        type: boolean

# Publishes serialise per target branch, so runs cannot finish out of
# order and regress the rolling SNAPSHOT-latest/STAGING-latest tags, and
# an in-flight publish always completes. The workflow name scopes the
# repository-wide group to this lane.
concurrency:
  # yamllint disable-line rule:line-length
  group: ${{ github.workflow }}-${{ inputs.GERRIT_PROJECT }}-${{ inputs.GERRIT_BRANCH }}
  cancel-in-progress: false

permissions: {}

jobs:
  # Comment on the merged change so the start of the merge pipeline is
  # visible in Gerrit (comment-only: the change has already merged).
  notify:
    if: inputs.GERRIT_DISABLED != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: "Harden runner"
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c  # v2.23.0
        with:
          egress-policy: audit
      - name: "Notify merge pipeline start"
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/gerrit-review-action@31093af31cec3755c34d8563ee54e2b7eb3a4eac  # v1.3.1
        with:
          host: ${{ vars.GERRIT_SERVER }}
          username: ${{ vars.GERRIT_SSH_USER }}
          key: ${{ secrets.GERRIT_SSH_PRIVKEY }}
          known_hosts: ${{ vars.GERRIT_KNOWN_HOSTS }}
          gerrit-change-number: ${{ inputs.GERRIT_CHANGE_NUMBER }}
          gerrit-patchset-number: ${{ inputs.GERRIT_PATCHSET_NUMBER }}
          vote-type: clear
          comment-only: "true"
      - name: "Allow replication"
        run: sleep 10s

  merge:
    needs: notify
    if: >-
      always()
      && (needs.notify.result == 'success'
          || needs.notify.result == 'skipped')
    permissions:
      contents: read
    # yamllint disable-line rule:line-length
    uses: lfreleng-actions/docker-workflows/.github/workflows/merge.yaml@55ab8c97e089c14dbec239953e5bb81464f668bb  # v0.13.1
    with:
      # With GERRIT_DISABLED the gerrit_* values are blanked, so the
      # reusable checks out the default branch.
      # yamllint disable-line rule:line-length
      gerrit_refspec: ${{ !inputs.GERRIT_DISABLED && inputs.GERRIT_REFSPEC || '' }}
      # yamllint disable-line rule:line-length
      gerrit_project: ${{ !inputs.GERRIT_DISABLED && inputs.GERRIT_PROJECT || '' }}
      # yamllint disable-line rule:line-length
      gerrit_branch: ${{ !inputs.GERRIT_DISABLED && inputs.GERRIT_BRANCH || '' }}
      # No gerrit_revision: on change-merged, GERRIT_PATCHSET_REVISION is
      # the change's own commit, not the merge commit Gerrit records when
      # the change is not based on the branch tip. Without it each job
      # checks out the branch tip, which holds the change as merged.
      # gerrit_url falls back to the GERRIT_URL organisation variable.
      snapshot_registry: "nexus3.onap.org:10003"
      release_registry: "nexus3.onap.org:10002"
      build_command: "docker build --tag onap/oom/readiness:verify ."
      build_command_images: "onap/oom/readiness:verify"
      namespace_mode: "manual"
      namespace: "onap"
      build_permit_egress_traffic: true
      lint_permit_fail: true
      grype_permit_fail: true
      grype_cache_db: "restore-only"
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
      VAULT_MAPPING_JSON: ${{ secrets.VAULT_MAPPING_JSON }}

  # Point 'latest' at the image this run staged (see LATEST above).
  tag-latest:
    needs: merge
    if: >-
      ${{ !cancelled()
      && github.ref == 'refs/heads/master'
      && needs.merge.outputs.snapshot_publish_result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Reads when this run left the queue, to recognise its snapshot
      actions: read
    timeout-minutes: 10
    env:
      IMAGE: "nexus3.onap.org:10003/onap/oom/readiness"
    steps:
      - name: "Load egress allow-list"
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@65ff87957e1cac2de3203a85dbb07c31810321cb  # v0.16.4
        with:
          # The list the reusable pins; it covers Nexus and 1Password.
          # yamllint disable-line rule:line-length
          config: "lfreleng-actions//.github/harden-runner/lfreleng-actions/allow_list.txt@6e6cab073a93c0d58e4e8846d44e1cbddbac975b"
          allow_list_summary: "false"
      - name: "Harden runner"
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c  # v2.23.0
        with:
          egress-policy: block
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}
      - name: "Find the snapshot this run staged"
        id: staged
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Gerrit runs of this lane queue per branch (see concurrency)
          # and a run's jobs are created only once it leaves the queue,
          # so a snapshot stamped after this run's first job was created
          # is this run's own (barring an overlapping GERRIT_DISABLED
          # run, whose snapshot is just as new a build of the branch).
          # The publish job also succeeds when it pushes nothing
          # (credential unavailable); 'latest' then stays where it is.
          run_url="repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          started=$(gh api --jq '[.jobs[].created_at] | min' \
            "${run_url}/attempts/1/jobs?per_page=100")
          since=$(date -u -d "${started}" '+%Y%m%dT%H%M%SZ')
          tags=$(curl -fsS "https://${IMAGE%%/*}/v2/${IMAGE#*/}/tags/list" \
            | jq -r '.tags[]?')
          tag=$(printf '%s\n' "${tags}" \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+-[0-9]{8}T[0-9]{6}Z$' \
            | awk -F- '{print $NF, $0}' | sort | tail -n 1 \
            | cut -d' ' -f2) || true
          if [ -z "${tag}" ] || [[ "${tag##*-}" < "${since}" ]]; then
            echo "::warning::No snapshot staged by this run;" \
              "'latest' stays where it is"
            tag=""
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
      - name: "Load registry credential"
        id: credential
        if: steps.staged.outputs.tag != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/credential-load-action@c4bf64f187865afb318669d8c9a95147c9e9d832  # v2.1.1
        with:
          # yamllint disable-line rule:line-length
          op_service_account_token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          vault_mapping_json: ${{ secrets.VAULT_MAPPING_JSON }}
          credential_name: "oom-readiness"
          credential_grants_json: ${{ vars.CREDENTIAL_LOAD_GRANTS }}
          export_env: "false"
      - name: "Login to snapshot registry"
        if: steps.staged.outputs.tag != ''
        # yamllint disable-line rule:line-length
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: "nexus3.onap.org:10003"
          username: "oom-readiness"
          password: ${{ steps.credential.outputs.credential }}
      - name: "Move latest"
        if: steps.staged.outputs.tag != ''
        shell: bash
        env:
          SOURCE: ${{ steps.staged.outputs.tag }}
        run: |
          # --prefer-index=false copies the manifest byte for byte, rather
          # than wrapping it in a new index, so 'latest' gets the staged
          # digest.
          docker buildx imagetools create --prefer-index=false \
            --tag "${IMAGE}:latest" "${IMAGE}:${SOURCE}"
          digest() {
            docker buildx imagetools inspect "$1" \
              --format '{{json .Manifest}}' | jq -er .digest
          }
          want=$(digest "${IMAGE}:${SOURCE}")
          got=$(digest "${IMAGE}:latest")
          if [ "${got}" != "${want}" ]; then
            echo "::error::latest is ${got}, expected ${want}"
            exit 1
          fi
          {
            echo "## Snapshot latest"
            echo ""
            echo "\`${IMAGE}:latest\` now holds \`${SOURCE}\` (\`${want}\`)"
          } >> "${GITHUB_STEP_SUMMARY}"

  # Report the overall workflow conclusion back to Gerrit as a comment
  # (comment-only: merge pipelines never vote).
  report:
    if: ${{ always() && inputs.GERRIT_DISABLED != true }}
    needs: [notify, merge, tag-latest]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # workflow-conclusion queries the Actions API to list run jobs
      actions: read
    timeout-minutes: 5
    steps:
      - name: "Harden runner"
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c  # v2.23.0
        with:
          egress-policy: audit
      - name: "Get conclusion"
        # yamllint disable-line rule:line-length
        uses: im-open/workflow-conclusion@8eac7f17381a6917bc04fec3e2c92e70ebc37526  # v3.0.0
      - name: "Report conclusion"
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/gerrit-review-action@31093af31cec3755c34d8563ee54e2b7eb3a4eac  # v1.3.1
        with:
          host: ${{ vars.GERRIT_SERVER }}
          username: ${{ vars.GERRIT_SSH_USER }}
          key: ${{ secrets.GERRIT_SSH_PRIVKEY }}
          known_hosts: ${{ vars.GERRIT_KNOWN_HOSTS }}
          gerrit-change-number: ${{ inputs.GERRIT_CHANGE_NUMBER }}
          gerrit-patchset-number: ${{ inputs.GERRIT_PATCHSET_NUMBER }}
          vote-type: ${{ env.WORKFLOW_CONCLUSION }}
          comment-only: "true"
